<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2e4c3">
<meta name="description" content="Ramayana Scroll — the whole epic as a playable wall painting. Inspired by Madhubani art. Told after Valmiki, with reverence.">
<title>Ramayana Scroll</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --cream: #f2e4c3; --paper: #f8efd9; --black: #1d1613; --indigo: #28367c; --turmeric: #e6ac17; --madder: #96283a; --leaf: #3f8038; --kusum: #cf2a1c; --text: 1; }
  html, body { margin: 0; height: 100%; background: #1d1613; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Alegreya Sans", system-ui, sans-serif; color: var(--black); }
  #game { display: block; background: var(--cream); outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }
  .plate { background: var(--paper); border: 3px solid var(--black); box-shadow: inset 0 0 0 3px var(--turmeric), inset 0 0 0 5px var(--black); padding: 14px 18px; border-radius: 3px; }
  button.btn { font: 700 calc(18px * var(--text)) "Alegreya Sans", sans-serif; min-height: 48px; min-width: 48px; padding: 8px 18px; margin: 5px; color: var(--black); background: var(--paper);
    border: 2.5px solid var(--black); box-shadow: inset 0 0 0 3px var(--turmeric); border-radius: 3px; cursor: pointer; }
  button.btn.main { background: var(--indigo); color: #fbf5e4; box-shadow: inset 0 0 0 3px var(--turmeric); font-size: calc(22px * var(--text)); padding: 10px 28px; }
  button.btn:focus-visible { outline: 3px solid var(--kusum); outline-offset: 2px; }
  button.btn:disabled { opacity: .55; cursor: default; }
  button.btn small { display: block; font-weight: 400; font-size: .72em; }
  #dialogue { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--sab)); width: min(860px, 88vw); min-height: 64px; font-size: max(16px, calc(min(2.9vh, 21px) * var(--text))); line-height: 1.3; cursor: pointer; }
  #dialogue.top { bottom: auto; top: calc(12px + var(--sat)); }
  #dialogue .who { font: 400 1.05em "Yatra One", serif; color: var(--madder); margin-bottom: 2px; }
  #dialogue .say.narr { font-style: italic; }
  #dialogue .more { position: absolute; right: 12px; bottom: 6px; font-size: .8em; opacity: .7; }
  .center { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; max-width: min(720px, 92vw); max-height: 92vh; overflow-y: auto; }
  .center h1, .center h2 { font: 400 1.6em "Yatra One", serif; margin: 4px 0 6px; color: var(--madder); }
  .center p { margin: 6px 0; font-size: calc(17px * var(--text)); }
  .note { text-align: left; font-size: calc(15px * var(--text)); max-height: 34vh; overflow-y: auto; border-top: 2px solid var(--black); margin-top: 8px; padding-top: 6px; }
  .note .src { font-size: .85em; opacity: .8; margin-top: 4px; }
  .seals { font-size: 30px; letter-spacing: 6px; margin: 4px 0; }
  .seal { display: inline-block; width: 30px; height: 30px; }
  .stats { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: calc(15px * var(--text)); }
  #topbar { position: fixed; top: calc(6px + var(--sat)); right: calc(8px + var(--sar)); display: flex; gap: 6px; }
  #topbar button.btn { min-width: 48px; padding: 4px 12px; font-size: 15px; margin: 0; opacity: .9; }
  #touch .tb { position: fixed; border-radius: 50%; border: 3px solid var(--black); background: rgba(248,239,217,.55); box-shadow: inset 0 0 0 3px rgba(230,172,23,.7);
    display: flex; align-items: center; justify-content: center; font: 700 15px "Alegreya Sans", sans-serif; color: var(--black); opacity: .5; transition: opacity .3s; touch-action: none; }
  #touch .tb.on, #touch .tb.flash { opacity: 1; background: rgba(248,239,217,.85); }
  #touch .tb.flash { box-shadow: inset 0 0 0 5px var(--indigo); }
  #touch .tb svg { width: 60%; height: 60%; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: stretch; }
  .settings label { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 6px 0; font-size: calc(16px * var(--text)); }
  .settings input[type=range] { width: 160px; }
  .settings select { font: inherit; padding: 4px; }
  #rotate { position: fixed; inset: 0; background: var(--cream); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #draftNote { position: fixed; left: 8px; bottom: 4px; font-size: 12px; background: var(--paper); padding: 2px 6px; border: 1px solid var(--black); }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); }
  .card { min-width: 260px; }
  .card .ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card .lock { font-size: .85em; opacity: .75; padding: 6px 4px; }
  .mini { font-size: 13px; opacity: .8; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--cream); font: 400 26px "Yatra One", serif; color: var(--madder); z-index: 60; }
  #loading .bar { width: 220px; height: 12px; border: 2px solid var(--black); margin-top: 12px; background: var(--paper); }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--madder); transition: width .2s; }
  .heads { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px; }
  @media (max-height: 520px) {
    #dialogue { bottom: auto; top: calc(6px + var(--sat)); width: min(62vw, 720px); min-height: 0; padding: 7px 12px; font-size: max(15px, calc(15px * var(--text))); }
    .plate { padding: 9px 12px; }
    .center { max-height: 96vh; }
    .center h1, .center h2 { font-size: 1.3em; }
    button.btn { min-height: 44px; padding: 5px 14px; font-size: calc(16px * var(--text)); }
    button.btn.main { font-size: calc(18px * var(--text)); }
    .note { max-height: 26vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="loading"><div style="text-align:center"><div>Grinding the colours…</div><div class="bar"><i id="loadbar"></i></div></div></div>
<canvas id="game" tabindex="0" role="img" aria-label="Ramayana Scroll"></canvas>
<div id="ui">
  <div id="dialogue" class="plate hidden" role="status" aria-live="polite"><div class="who"></div><div class="say"></div><div class="more">▸</div></div>
  <div id="topbar" class="hidden"></div>
  <div id="touch" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="toast" class="plate hidden" role="status" aria-live="polite"></div>
  <div id="draftNote" class="hidden"></div>
</div>
<div id="rotate" class="hidden"><div class="plate" style="text-align:center"><div style="font:400 26px 'Yatra One',serif;color:#96283a">Turn me sideways</div><p>The scroll is painted for a landscape screen.</p></div></div>
<noscript>This painted game needs JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
