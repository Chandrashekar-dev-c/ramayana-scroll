<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="author" content="Chandrashekar C">
<meta name="theme-color" content="#1d1613">
<meta name="description" content="Ramayana Scroll — the Ramayana staged as a Ramlila, inspired by Madhubani art. Told after Valmiki, with reverence.">
<title>Ramayana Scroll</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --cream: #f2e4c3; --paper: #f8efd9; --black: #1d1613; --indigo: #28367c; --turmeric: #e6ac17; --madder: #96283a; --leaf: #3f8038; --kusum: #cf2a1c; --text: 1; }
  html, body { margin: 0; height: 100%; background: #120c09; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Alegreya Sans", system-ui, sans-serif; color: var(--black); }
  #stack { position: relative; }
  #gl, #game { display: block; }
  #game { position: absolute; left: 0; top: 0; outline: none; background: transparent; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }
  .plate { background: var(--paper); border: 3px solid var(--black); box-shadow: inset 0 0 0 3px var(--turmeric), inset 0 0 0 5px var(--black), 0 8px 30px rgba(0,0,0,.45); padding: 14px 18px; border-radius: 3px; }
  button.btn { font: 700 calc(18px * var(--text)) "Alegreya Sans", sans-serif; min-height: 48px; min-width: 48px; padding: 8px 18px; margin: 5px; color: var(--black); background: var(--paper);
    border: 2.5px solid var(--black); box-shadow: inset 0 0 0 3px var(--turmeric); border-radius: 3px; cursor: pointer; transition: transform .12s ease, background .2s; }
  button.btn:active { transform: scale(.96); }
  button.btn.main { background: var(--indigo); color: #fbf5e4; box-shadow: inset 0 0 0 3px var(--turmeric); font-size: calc(22px * var(--text)); padding: 10px 28px; }
  button.btn.ghost { background: rgba(248,239,217,.14); color: #fbf5e4; border-color: rgba(251,245,228,.6); box-shadow: inset 0 0 0 2px rgba(230,172,23,.55); }
  button.btn:focus-visible { outline: 3px solid var(--kusum); outline-offset: 2px; }
  button.btn:disabled { opacity: .55; cursor: default; }
  button.btn small { display: block; font-weight: 400; font-size: .72em; }
  /* the dialogue: a painted banner hung from the canopy */
  #dialogue { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + var(--sat)); width: min(860px, 74vw); min-height: 58px; font-size: max(16px, calc(min(3vh, 21px) * var(--text))); line-height: 1.32; cursor: pointer;
    background: linear-gradient(#fbf3de, #f3e5c2); border: 3px solid var(--black); box-shadow: inset 0 0 0 3px var(--turmeric), inset 0 0 0 5px var(--black), 0 10px 30px rgba(0,0,0,.5); padding: 10px 18px 12px; border-radius: 3px; transition: opacity .18s, transform .18s; }
  #dialogue.enter { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  #dialogue .who { font: 400 1.05em "Yatra One", serif; color: var(--madder); margin-bottom: 1px; display: flex; align-items: center; gap: 8px; }
  #dialogue .who i { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--black); border-radius: 50%; background: var(--c, var(--madder)); }
  #dialogue .say.narr { font-style: italic; color: #3a2a1f; }
  #dialogue .more { position: absolute; right: 12px; bottom: 5px; font-size: .8em; opacity: .75; font-style: italic; animation: rs-bob 1.1s ease-in-out infinite; }
  @keyframes rs-bob { 50% { transform: translateY(3px); } }
  .center { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; max-width: min(720px, 92vw); max-height: 92vh; overflow-y: auto; }
  .center h1, .center h2 { font: 400 1.6em "Yatra One", serif; margin: 4px 0 6px; color: var(--madder); }
  .center p { margin: 6px 0; font-size: calc(17px * var(--text)); }
  .note { text-align: left; font-size: calc(15px * var(--text)); max-height: 34vh; overflow-y: auto; border-top: 2px solid var(--black); margin-top: 8px; padding-top: 6px; }
  .note .src { font-size: .85em; opacity: .8; margin-top: 4px; }
  .seals { font-size: 30px; letter-spacing: 6px; margin: 4px 0; }
  .seal { display: inline-block; width: 30px; height: 30px; }
  #topbar { position: fixed; top: calc(6px + var(--sat)); right: calc(8px + var(--sar)); display: flex; gap: 6px; }
  #topbar button.btn { min-width: 44px; min-height: 40px; padding: 2px 12px; font-size: 15px; margin: 0; opacity: .82; background: rgba(248,239,217,.92); }
  /* touch controls: small, low, out of the fight */
  #touch .tb { position: fixed; border-radius: 50%; border: 2.5px solid rgba(29,22,19,.85); background: rgba(248,239,217,.34); box-shadow: inset 0 0 0 2.5px rgba(230,172,23,.55);
    display: flex; align-items: center; justify-content: center; color: var(--black); opacity: .62; transition: opacity .25s, transform .08s, background .2s; touch-action: none; }
  #touch .tb.on { opacity: 1; background: rgba(248,239,217,.8); transform: scale(.94); }
  #touch .tb.flash { opacity: 1; background: rgba(248,239,217,.85); box-shadow: inset 0 0 0 5px var(--indigo); animation: rs-pulse .6s ease-in-out infinite; }
  #touch .tb.dim { opacity: .28; }
  @keyframes rs-pulse { 50% { transform: scale(1.08); } }
  #touch .tb svg { width: 58%; height: 58%; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: stretch; }
  .settings label { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 6px 0; font-size: calc(16px * var(--text)); }
  .settings input[type=range] { width: 160px; }
  #rotate { position: fixed; inset: 0; background: #1d1613; display: flex; align-items: center; justify-content: center; z-index: 50; }
  .rotplate { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 80vw; }
  .rottitle { font: 400 26px 'Yatra One', serif; color: #96283a; }
  .rotphone { width: 150px; height: 150px; }
  .rotphone .turn { transform-origin: 0 0; animation: rs-turn 2.6s ease-in-out infinite; }
  @keyframes rs-turn { 0%, 18% { transform: rotate(0deg); } 50%, 80% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); }
  .chapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px; text-align: left; margin-top: 8px; }
  .chapters button.btn { text-align: left; margin: 0; }
  .chapters .k { font: 400 13px "Yatra One", serif; color: var(--madder); display: block; }
  .mini { font-size: 13px; opacity: .8; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: calc(5vh + var(--sab)); gap: 4px; pointer-events: none; }
  #title > * { pointer-events: auto; }
  #title .row button.btn { min-width: 150px; }
  #title .credit { color: #f2e4c3; opacity: .75; font-size: 13px; margin-top: 2px; text-shadow: 0 1px 3px #000; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1d1613; font: 400 26px "Yatra One", serif; color: #e6ac17; z-index: 60; transition: opacity .5s; }
  #loading .bar { width: 220px; height: 10px; border: 2px solid #e6ac17; margin: 14px auto 0; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #e6ac17; transition: width .2s; }
  #fade { position: fixed; inset: 0; background: #120c09; opacity: 0; pointer-events: none; z-index: 30; transition: opacity .45s ease; }
  #fade.on { opacity: 1; }
  @media (max-height: 520px) {
    #dialogue { width: min(66vw, 740px); min-height: 0; padding: 7px 14px 9px; font-size: max(15px, calc(15.5px * var(--text))); }
    .plate { padding: 9px 12px; }
    .center { max-height: 96vh; }
    .center h1, .center h2 { font-size: 1.3em; }
    button.btn { min-height: 42px; padding: 5px 14px; font-size: calc(16px * var(--text)); }
    button.btn.main { font-size: calc(18px * var(--text)); }
    .note { max-height: 26vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="loading"><div style="text-align:center"><div>Lighting the lamps…</div><div class="bar"><i id="loadbar"></i></div></div></div>
<div id="stack">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="game" tabindex="0" role="img" aria-label="Ramayana Scroll"></canvas>
</div>
<div id="fade"></div>
<div id="ui">
  <div id="title" class="hidden"></div>
  <div id="dialogue" class="hidden" role="status" aria-live="polite"><div class="who"></div><div class="say"></div><div class="more">▸</div></div>
  <div id="topbar" class="hidden"></div>
  <div id="touch" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="toast" class="plate hidden" role="status" aria-live="polite"></div>
</div>
<div id="rotate" class="hidden"><div class="plate rotplate">
  <svg class="rotphone" viewBox="-70 -70 140 140" aria-hidden="true">
    <g class="turn"><rect x="-30" y="-52" width="60" height="104" rx="9" fill="#f8efd9" stroke="#1d1613" stroke-width="4"/><rect x="-23" y="-42" width="46" height="80" fill="#f2e4c3" stroke="#e6ac17" stroke-width="3"/></g>
  </svg>
  <div class="rottitle">Turn me sideways</div>
  <p>The stage is set for a landscape screen.</p>
</div></div>
<script>
  (function () {
    function stuck(msg) {
      var box = document.querySelector('#loading > div');
      if (box && document.getElementById('loading')) box.innerHTML = '<div>' + msg + '</div><div style="font:400 16px sans-serif;margin-top:12px;color:#f2e4c3">Check your connection, then reload this page.</div>';
    }
    window.addEventListener('error', function (e) { if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) stuck('The game files did not load.'); }, true);
    setTimeout(function () { stuck('This is taking longer than usual.'); }, 25000);
  })();
</script>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
