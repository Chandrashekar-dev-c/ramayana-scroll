<!doctype html><html><head><meta charset="utf-8"><title>sheet</title><style>body{margin:0;background:#f2e4c3}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { renderSheet } from '../src/ui/sheet.js';
const q = new URLSearchParams(location.search);
