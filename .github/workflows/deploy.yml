name: Deploy to GitHub Pages

# master is the live game at the site root; the overhaul branch is built into /next/ as a
# preview until it is merged.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the overhaul preview into /next/
        run: |
          if git ls-remote --exit-code --heads origin overhaul >/dev/null; then
            git fetch --depth 1 origin overhaul
            git worktree add ../next origin/overhaul
            cd ../next && npm ci && npm run build
            mkdir -p "$GITHUB_WORKSPACE/dist/next" && cp -r dist/. "$GITHUB_WORKSPACE/dist/next/"
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
